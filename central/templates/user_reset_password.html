{% extends "base.html" %}
{% block title %}Resetear contraseña{% endblock %}
{% block content %}
<h2>Resetear contraseña de '{{ user.username }}'</h2>
<p class="muted">Escribe la contraseña nueva y avísale al usuario por un medio seguro -- esta pantalla no le manda nada automáticamente.</p>
<form class="card" method="post">
  <label>Contraseña nueva
    <input type="password" name="password" required minlength="6" autofocus>
  </label>
  <button type="submit">Actualizar contraseña</button>
</form>
{% endblock %}
