# Runs identically on Windows (Docker Desktop) and Ubuntu (Docker Engine)
# -- see deploy/docker/README.md for setup, first-admin bootstrap, and the
# one thing that genuinely differs by platform (reaching the biometric
# devices on the LAN from inside a container).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asistencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asistencia}
    # Publicado hacia afuera (no solo entre contenedores) a propósito --
    # sin esto, un agente remoto en otra sede (central/remote_agent.py,
    # ver deploy/docker/README.md) nunca puede llegar a este Postgres por
    # VPN aunque la VPN en sí funcione perfecto: Docker solo lo hacía
    # visible entre los contenedores de este mismo compose (web/sync),
    # nunca desde otra máquina. Si por seguridad no querés exponerlo (ej.
    # ninguna sede remota todavía), comentá estas dos líneas.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asistencia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-asistencia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-asistencia}
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY in .env}
    ports:
      - "${WEB_PORT:-5000}:5000"

  sync:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-asistencia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-asistencia}
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY in .env}
      SYNC_DAILY_AT: ${SYNC_DAILY_AT:-23:00}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-}
    command: ["python", "-m", "central.sync_loop"]

volumes:
  db_data:
